<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Repositories - padrian2s</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e0e0e0;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header p {
            color: #888;
            font-size: 1.1rem;
        }

        .profile-link {
            color: #00d4ff;
            text-decoration: none;
        }

        .profile-link:hover {
            text-decoration: underline;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            justify-content: center;
            align-items: center;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-group label {
            font-size: 0.9rem;
            color: #aaa;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 10px 15px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #1e1e30;
            transition: border-color 0.2s, background 0.2s;
        }

        .checkbox-group:hover {
            border-color: #00d4ff;
        }

        .checkbox-group.active {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.1);
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #00d4ff;
        }

        .checkbox-group label {
            cursor: pointer;
            user-select: none;
        }

        .pages-icon {
            color: #00d4ff;
        }

        select, input[type="text"] {
            padding: 10px 15px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #1e1e30;
            color: #e0e0e0;
            font-size: 0.95rem;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        select:hover, input[type="text"]:hover {
            border-color: #00d4ff;
        }

        select:focus, input[type="text"]:focus {
            outline: none;
            border-color: #00d4ff;
        }

        .stats-summary {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px 30px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: bold;
            color: #00d4ff;
        }

        .stat-card .label {
            font-size: 0.85rem;
            color: #888;
            margin-top: 5px;
        }

        .loading {
            text-align: center;
            padding: 60px;
            font-size: 1.2rem;
            color: #888;
        }

        .loading::after {
            content: '';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .error {
            text-align: center;
            padding: 40px;
            background: rgba(255, 0, 0, 0.1);
            border-radius: 12px;
            color: #ff6b6b;
        }

        .repos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .repo-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 24px;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
        }

        .repo-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 40px rgba(0, 212, 255, 0.1);
            border-color: rgba(0, 212, 255, 0.3);
        }

        .repo-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .repo-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: #00d4ff;
            text-decoration: none;
            word-break: break-word;
        }

        .repo-name:hover {
            text-decoration: underline;
        }

        .repo-visibility {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
            color: #888;
            flex-shrink: 0;
            margin-left: 10px;
        }

        .repo-description {
            color: #999;
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 16px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .repo-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 16px;
        }

        .repo-stat {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: #aaa;
        }

        .repo-stat svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .repo-stat.stars { color: #ffd700; }
        .repo-stat.forks { color: #7b2cbf; }
        .repo-stat.watchers { color: #00d4ff; }
        .repo-stat.issues { color: #ff6b6b; }
        .repo-stat.pages { color: #22c55e; }

        .pages-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
            margin-left: 8px;
        }

        .pages-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #22c55e;
            text-decoration: none;
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 8px;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            transition: all 0.2s;
            margin-top: 12px;
        }

        .pages-link:hover {
            background: rgba(34, 197, 94, 0.2);
            border-color: #22c55e;
        }

        .repo-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 0.8rem;
            color: #666;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .language-badge {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .language-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .repo-topics {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 12px;
        }

        .topic {
            font-size: 0.75rem;
            padding: 4px 10px;
            background: rgba(0, 212, 255, 0.15);
            color: #00d4ff;
            border-radius: 20px;
        }

        .no-repos {
            text-align: center;
            padding: 60px;
            color: #888;
            font-size: 1.1rem;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #555;
            font-size: 0.85rem;
        }

        @media (max-width: 600px) {
            .repos-grid {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
            }

            header h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>GitHub Repository Scanner</h1>
            <p>Repositories from <a href="https://github.com/padrian2s" target="_blank" class="profile-link">@padrian2s</a></p>
        </header>

        <div class="stats-summary" id="statsSummary">
            <!-- Filled by JS -->
        </div>

        <div class="controls">
            <div class="checkbox-group" id="pagesFilterGroup">
                <input type="checkbox" id="filterPages" checked>
                <label for="filterPages">GitHub Pages Only</label>
            </div>
            <div class="control-group">
                <label for="sortBy">Sort by:</label>
                <select id="sortBy">
                    <option value="updated">Recently Updated</option>
                    <option value="created">Recently Created</option>
                    <option value="stars">Stars</option>
                    <option value="forks">Forks</option>
                    <option value="name">Name (A-Z)</option>
                    <option value="size">Size</option>
                    <option value="issues">Open Issues</option>
                </select>
            </div>
            <div class="control-group">
                <label for="filterLanguage">Language:</label>
                <select id="filterLanguage">
                    <option value="">All Languages</option>
                </select>
            </div>
            <div class="control-group">
                <label for="searchInput">Search:</label>
                <input type="text" id="searchInput" placeholder="Filter repositories...">
            </div>
        </div>

        <div id="reposContainer">
            <div class="loading">Loading repositories</div>
        </div>

        <footer>
            <p>Data fetched from GitHub API | Last updated: <span id="lastUpdated">-</span></p>
        </footer>
    </div>

    <script>
        const GITHUB_USERNAME = 'padrian2s';
        const API_URL = `https://api.github.com/users/${GITHUB_USERNAME}/repos?per_page=100&sort=updated`;

        let allRepos = [];

        // Language colors from GitHub
        const languageColors = {
            'JavaScript': '#f1e05a',
            'TypeScript': '#3178c6',
            'Python': '#3572A5',
            'Java': '#b07219',
            'C++': '#f34b7d',
            'C': '#555555',
            'C#': '#178600',
            'Go': '#00ADD8',
            'Rust': '#dea584',
            'Ruby': '#701516',
            'PHP': '#4F5D95',
            'Swift': '#F05138',
            'Kotlin': '#A97BFF',
            'Scala': '#c22d40',
            'HTML': '#e34c26',
            'CSS': '#563d7c',
            'Shell': '#89e051',
            'Dart': '#00B4AB',
            'Vue': '#41b883',
            'R': '#198CE7',
            'Jupyter Notebook': '#DA5B0B',
            'MATLAB': '#e16737',
            'Dockerfile': '#384d54',
            'Makefile': '#427819',
            'Haskell': '#5e5086',
            'Lua': '#000080',
            'Perl': '#0298c3',
            'Elixir': '#6e4a7e',
            'Clojure': '#db5855',
            'Objective-C': '#438eff'
        };

        async function fetchRepositories() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) {
                    throw new Error(`GitHub API error: ${response.status}`);
                }
                const repos = await response.json();
                return repos.filter(repo => !repo.fork); // Exclude forks by default
            } catch (error) {
                throw error;
            }
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffTime = Math.abs(now - date);
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays === 0) return 'Today';
            if (diffDays === 1) return 'Yesterday';
            if (diffDays < 7) return `${diffDays} days ago`;
            if (diffDays < 30) return `${Math.floor(diffDays / 7)} weeks ago`;
            if (diffDays < 365) return `${Math.floor(diffDays / 30)} months ago`;
            return `${Math.floor(diffDays / 365)} years ago`;
        }

        function formatSize(sizeKB) {
            if (sizeKB < 1024) return `${sizeKB} KB`;
            return `${(sizeKB / 1024).toFixed(1)} MB`;
        }

        function renderStatsSummary(repos) {
            const totalStars = repos.reduce((sum, r) => sum + r.stargazers_count, 0);
            const totalForks = repos.reduce((sum, r) => sum + r.forks_count, 0);
            const languages = [...new Set(repos.map(r => r.language).filter(Boolean))];
            const pagesCount = repos.filter(r => r.has_pages).length;

            document.getElementById('statsSummary').innerHTML = `
                <div class="stat-card">
                    <div class="value">${repos.length}</div>
                    <div class="label">Repositories</div>
                </div>
                <div class="stat-card">
                    <div class="value" style="color: #22c55e;">${pagesCount}</div>
                    <div class="label">GitHub Pages</div>
                </div>
                <div class="stat-card">
                    <div class="value">${totalStars}</div>
                    <div class="label">Total Stars</div>
                </div>
                <div class="stat-card">
                    <div class="value">${totalForks}</div>
                    <div class="label">Total Forks</div>
                </div>
            `;
        }

        function populateLanguageFilter(repos) {
            const languages = [...new Set(repos.map(r => r.language).filter(Boolean))].sort();
            const select = document.getElementById('filterLanguage');

            languages.forEach(lang => {
                const option = document.createElement('option');
                option.value = lang;
                option.textContent = lang;
                select.appendChild(option);
            });
        }

        function getGitHubPagesUrl(repo) {
            // Standard GitHub Pages URL pattern
            if (repo.name === `${GITHUB_USERNAME}.github.io`) {
                return `https://${GITHUB_USERNAME}.github.io`;
            }
            return `https://${GITHUB_USERNAME}.github.io/${repo.name}`;
        }

        function renderRepoCard(repo) {
            const langColor = languageColors[repo.language] || '#888';
            const topics = repo.topics || [];
            const pagesUrl = repo.has_pages ? getGitHubPagesUrl(repo) : null;

            return `
                <div class="repo-card">
                    <div class="repo-header">
                        <a href="${repo.html_url}" target="_blank" class="repo-name">${repo.name}</a>
                        <div>
                            ${repo.has_pages ? '<span class="pages-badge"><svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg> Pages</span>' : ''}
                            <span class="repo-visibility">${repo.private ? 'Private' : 'Public'}</span>
                        </div>
                    </div>
                    ${repo.description ? `<p class="repo-description">${repo.description}</p>` : '<p class="repo-description" style="color:#555;font-style:italic;">No description</p>'}
                    <div class="repo-stats">
                        <span class="repo-stat stars">
                            <svg viewBox="0 0 16 16"><path d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.75.75 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25z"/></svg>
                            ${repo.stargazers_count}
                        </span>
                        <span class="repo-stat forks">
                            <svg viewBox="0 0 16 16"><path d="M5 3.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm0 2.122a2.25 2.25 0 10-1.5 0v.878A2.25 2.25 0 005.75 8.5h1.5v2.128a2.251 2.251 0 101.5 0V8.5h1.5a2.25 2.25 0 002.25-2.25v-.878a2.25 2.25 0 10-1.5 0v.878a.75.75 0 01-.75.75h-4.5A.75.75 0 015 6.25v-.878zm3.75 7.378a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm3-8.75a.75.75 0 100-1.5.75.75 0 000 1.5z"/></svg>
                            ${repo.forks_count}
                        </span>
                        <span class="repo-stat watchers">
                            <svg viewBox="0 0 16 16"><path d="M8 2c1.981 0 3.671.992 4.933 2.078 1.27 1.091 2.187 2.345 2.637 3.023a1.62 1.62 0 010 1.798c-.45.678-1.367 1.932-2.637 3.023C11.67 13.008 9.981 14 8 14c-1.981 0-3.671-.992-4.933-2.078C1.797 10.83.88 9.576.43 8.898a1.62 1.62 0 010-1.798c.45-.677 1.367-1.931 2.637-3.022C4.33 2.992 6.019 2 8 2zM1.679 7.932a.12.12 0 000 .136c.411.622 1.241 1.75 2.366 2.717C5.176 11.758 6.527 12.5 8 12.5c1.473 0 2.825-.742 3.955-1.715 1.124-.967 1.954-2.096 2.366-2.717a.12.12 0 000-.136c-.412-.621-1.242-1.75-2.366-2.717C10.824 4.242 9.473 3.5 8 3.5c-1.473 0-2.824.742-3.955 1.715-1.124.967-1.954 2.096-2.366 2.717zM8 10a2 2 0 110-4 2 2 0 010 4z"/></svg>
                            ${repo.watchers_count}
                        </span>
                        ${repo.open_issues_count > 0 ? `
                        <span class="repo-stat issues">
                            <svg viewBox="0 0 16 16"><path d="M8 9.5a1.5 1.5 0 100-3 1.5 1.5 0 000 3z"/><path d="M8 0a8 8 0 100 16A8 8 0 008 0zM1.5 8a6.5 6.5 0 1113 0 6.5 6.5 0 01-13 0z"/></svg>
                            ${repo.open_issues_count}
                        </span>` : ''}
                    </div>
                    <div class="repo-meta">
                        ${repo.language ? `
                        <span class="language-badge">
                            <span class="language-dot" style="background:${langColor}"></span>
                            ${repo.language}
                        </span>` : ''}
                        <span>${formatSize(repo.size)}</span>
                        <span>Updated ${formatDate(repo.updated_at)}</span>
                    </div>
                    ${topics.length > 0 ? `
                    <div class="repo-topics">
                        ${topics.slice(0, 5).map(t => `<span class="topic">${t}</span>`).join('')}
                    </div>` : ''}
                    ${pagesUrl ? `
                    <a href="${pagesUrl}" target="_blank" class="pages-link">
                        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8.636 3.5a.5.5 0 00-.5-.5H1.5A1.5 1.5 0 000 4.5v10A1.5 1.5 0 001.5 16h10a1.5 1.5 0 001.5-1.5V7.864a.5.5 0 00-1 0V14.5a.5.5 0 01-.5.5h-10a.5.5 0 01-.5-.5v-10a.5.5 0 01.5-.5h6.636a.5.5 0 00.5-.5z"/><path d="M16 .5a.5.5 0 00-.5-.5h-5a.5.5 0 000 1h3.793L6.146 9.146a.5.5 0 10.708.708L15 1.707V5.5a.5.5 0 001 0v-5z"/></svg>
                        Visit GitHub Pages
                    </a>` : ''}
                </div>
            `;
        }

        function sortRepos(repos, sortBy) {
            const sorted = [...repos];
            switch (sortBy) {
                case 'stars':
                    return sorted.sort((a, b) => b.stargazers_count - a.stargazers_count);
                case 'forks':
                    return sorted.sort((a, b) => b.forks_count - a.forks_count);
                case 'name':
                    return sorted.sort((a, b) => a.name.localeCompare(b.name));
                case 'created':
                    return sorted.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                case 'updated':
                    return sorted.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
                case 'size':
                    return sorted.sort((a, b) => b.size - a.size);
                case 'issues':
                    return sorted.sort((a, b) => b.open_issues_count - a.open_issues_count);
                default:
                    return sorted;
            }
        }

        function filterAndRender() {
            const sortBy = document.getElementById('sortBy').value;
            const language = document.getElementById('filterLanguage').value;
            const search = document.getElementById('searchInput').value.toLowerCase();
            const pagesOnly = document.getElementById('filterPages').checked;

            let filtered = allRepos;

            // Filter by GitHub Pages
            if (pagesOnly) {
                filtered = filtered.filter(r => r.has_pages);
            }

            if (language) {
                filtered = filtered.filter(r => r.language === language);
            }

            if (search) {
                filtered = filtered.filter(r =>
                    r.name.toLowerCase().includes(search) ||
                    (r.description && r.description.toLowerCase().includes(search)) ||
                    (r.topics && r.topics.some(t => t.toLowerCase().includes(search)))
                );
            }

            const sorted = sortRepos(filtered, sortBy);

            const container = document.getElementById('reposContainer');

            if (sorted.length === 0) {
                container.innerHTML = '<div class="no-repos">No repositories found matching your criteria</div>';
            } else {
                container.innerHTML = `<div class="repos-grid">${sorted.map(renderRepoCard).join('')}</div>`;
            }

            // Update checkbox styling
            const checkboxGroup = document.getElementById('pagesFilterGroup');
            if (pagesOnly) {
                checkboxGroup.classList.add('active');
            } else {
                checkboxGroup.classList.remove('active');
            }
        }

        async function init() {
            try {
                allRepos = await fetchRepositories();

                renderStatsSummary(allRepos);
                populateLanguageFilter(allRepos);
                filterAndRender();

                document.getElementById('lastUpdated').textContent = new Date().toLocaleString();

                // Event listeners
                document.getElementById('filterPages').addEventListener('change', filterAndRender);
                document.getElementById('sortBy').addEventListener('change', filterAndRender);
                document.getElementById('filterLanguage').addEventListener('change', filterAndRender);
                document.getElementById('searchInput').addEventListener('input', filterAndRender);

                // Initialize checkbox styling
                document.getElementById('pagesFilterGroup').classList.add('active');

            } catch (error) {
                document.getElementById('reposContainer').innerHTML = `
                    <div class="error">
                        <h3>Failed to load repositories</h3>
                        <p>${error.message}</p>
                        <p style="margin-top:10px;color:#888;">Try refreshing the page or check if the GitHub API is accessible.</p>
                    </div>
                `;
            }
        }

        init();
    </script>
</body>
</html>
